modLoader="javafml"
loaderVersion="[4,)"
license="Unlicense"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''Adds a mod list beside JEI's recipe viewer. Selecting a mod applies JEI's native @modid filter.'''
displayTest="IGNORE_SERVER_VERSION"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[21.1.0,)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[1.21.1,1.22)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="jei"
type="required"
versionRange="[19.0.0,)"
ordering="AFTER"
side="CLIENT"
